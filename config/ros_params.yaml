pathplanning_node:
  ros__parameters:
    # subscriber
    lane_points_subscriber: '/lane_detection/lane'
    image_subscriber: '/camera/image/undistorted'
    state_machine_subscriber: '/state_machine/debug' # Todo update
    state_machine_lane_subscriber: '/rightLane' # Todo update
    remote_state_subscriber: '/remoteState' # Todo update
    targetSteeringAngle_pub: '/control/steering_angle/target'


    # publisher
    image_debug_publisher: '/path_planning/debug/image'
    path_planning_right_publisher: '/path_planning/target/left'
    path_planning_left_publisher: '/path_planning/target/right'
    ref_point_publisher: '/path_planning/target/pose'         # maybe change to pathplanning

    # additional params
    trj_look_forward: 375      # adapt to speed and runtime
